<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><title>
    Playable spread verification</title
  ><style>
    body {
      margin: 0;
      background: #eeeae0;
      color: #263332;
      font:
        18px/1.5 Georgia,
        serif;
    }
    main {
      max-width: 1080px;
      margin: 4vh auto;
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      background: #fffdf8;
      padding: 2rem;
      gap: 2rem;
      min-height: 620px;
      box-sizing: border-box;
    }
    h1 {
      font-weight: 400;
      font-size: 2.5rem;
      line-height: 1.1;
    }
    article {
      padding: 1rem;
    }
    button {
      font: inherit;
    }
    #scene {
      min-width: 0;
    }
    p {
      max-width: 40ch;
    }
    @media (max-width: 700px) {
      main {
        display: block;
        margin: 0;
        padding: 1rem;
      }
      h1 {
        font-size: 2rem;
      }
    }
  </style>
  <main>
    <article>
      <h1 id="title"></h1>
      <p id="invite"></p>
      <p>Renderer verification fixture. The book shell is verified separately.</p>
      <button id="reset">Reset</button> <button id="level">Change level</button>
      <details>
        <summary>Reveal explanation</summary>
        <p id="explanation"></p>
      </details>
    </article>
    <section id="scene"></section>
  </main>
  <script type="module" src="./playable-spreads.ts"></script>
</html>
